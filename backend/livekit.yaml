# Настройки ЛОКАЛЬНОГО LiveKit для разработки (запускается через docker compose, см. docker-compose.yml).
# Это не боевая конфигурация: боевой медиасервер (отдельный VPS, TURN на 443/TLS) настраивается отдельно (раздел 11.3 ТЗ).
#
# Ключ API задаётся переменной окружения LIVEKIT_KEYS (из backend/.env), а не здесь: секретов в репозитории нет.

port: 7880

rtc:
  # Один TCP-порт и один UDP-порт на все соединения: так проще пробросить из Docker.
  tcp_port: 7881
  udp_port: 7882
  # Браузер на этой же машине обращается к контейнеру через localhost. Без явного адреса LiveKit объявил бы
  # внутренний адрес контейнера (172.x.x.x), который с хоста недоступен, и звонок не соединился бы.
  # Следствие: проверять звонок можно только с этого компьютера (две вкладки). Для проверки с телефона в одной
  # сети замените на LAN-адрес компьютера.
  node_ip: 127.0.0.1
  use_external_ip: false

# LiveKit присылает события (комната создана, участник вошёл или вышел) на этот адрес API.
# host.docker.internal: адрес компьютера изнутри контейнера. 5023 — порт API в профиле http (launchSettings.json).
# Запросы подписаны ключом из LIVEKIT_KEYS; API проверяет подпись и хеш тела.
webhook:
  api_key: devkey
  urls:
    - http://host.docker.internal:5023/api/v1/webhooks/livekit

logging:
  level: info
