# Локальная инфраструктура для разработки. Запуск: docker compose up -d
# Пароль берётся из backend/.env (шаблон — .env.example), в репозиторий .env не попадает.
services:
  postgres:
    image: postgres:17
    container_name: skillswap-postgres
    environment:
      POSTGRES_DB: skillswap
      POSTGRES_USER: skillswap
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Задайте POSTGRES_PASSWORD в backend/.env}
    ports:
      # Хост-порт 5433, а не 5432: на машинах с локально установленным PostgreSQL 5432 обычно занят.
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U skillswap -d skillswap"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Прототип медиасервера (этап 2): только проверка связки «выдача токена + подключение + webhook».
  # Боевой LiveKit с TURN на 443/TLS ставится на отдельный VPS позже (docs/DEFERRED.md).
  livekit:
    image: livekit/livekit-server:v1.13.11
    container_name: skillswap-livekit
    # --dev: режим разработки. Ключ API берётся из LIVEKIT_KEYS ниже; остальное — в livekit.yaml.
    command: ["--dev", "--config", "/etc/livekit.yaml"]
    environment:
      # Формат «имя_ключа: секрет». Секрет из backend/.env; длинный, потому что API подписывает токены HS256.
      LIVEKIT_KEYS: "devkey: ${LIVEKIT_API_SECRET:?Задайте LIVEKIT_API_SECRET в backend/.env (случайная строка от 32 символов)}"
    ports:
      - "7880:7880"        # HTTP и WebSocket сигнализации
      - "7881:7881"        # WebRTC по TCP
      - "7882:7882/udp"    # WebRTC по UDP
    volumes:
      - ./livekit.yaml:/etc/livekit.yaml:ro
    extra_hosts:
      # На Windows и macOS host.docker.internal есть сам; на Linux его нужно добавить, чтобы webhook доходил до API.
      - "host.docker.internal:host-gateway"

  # Почта для разработки (этап 4): SMTP-сервер, который ловит все письма и показывает их в браузере.
  # Приложению: Smtp:Host=localhost, Smtp:Port=1025, Smtp:Security=None (user-secrets). Письма: http://localhost:8025
  mailpit:
    image: axllent/mailpit:v1.21
    container_name: skillswap-mailpit
    ports:
      - "1025:1025"        # SMTP
      - "8025:8025"        # веб-интерфейс и API
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Хранилище файлов (этап 4, шаг 6): S3-совместимый Garage вместо MinIO (официальные образы MinIO больше не публикуются).
  # Первый запуск: docker compose up -d garage, затем scripts/init-storage.ps1 (или .sh): раскладка, ключ доступа, бакет.
  # Приложению: Storage:Endpoint=http://localhost:3900, ключи в user-secrets (скрипт напечатает команды).
  garage:
    image: dxflrs/garage:v1.0.1
    container_name: skillswap-garage
    environment:
      GARAGE_RPC_SECRET: ${GARAGE_RPC_SECRET:?Задайте GARAGE_RPC_SECRET в backend/.env (64 шестнадцатеричных символа)}
    ports:
      - "3900:3900"        # S3 API
    volumes:
      - ./garage.toml:/etc/garage.toml:ro
      - garage-meta:/var/lib/garage/meta
      - garage-data:/var/lib/garage/data
    healthcheck:
      test: ["CMD", "/garage", "status"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  garage-meta:
  garage-data:
  postgres-data:
