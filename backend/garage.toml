# Garage: S3-совместимое хранилище файлов для разработки (этап 4, шаг 6). Секрет RPC и ключи доступа не здесь:
# GARAGE_RPC_SECRET приходит из backend/.env, ключ доступа создаёт scripts/init-storage.
metadata_dir = "/var/lib/garage/meta"
data_dir = "/var/lib/garage/data"
db_engine = "sqlite"
replication_factor = 1

rpc_bind_addr = "[::]:3901"
rpc_public_addr = "127.0.0.1:3901"

[s3_api]
s3_region = "garage"
api_bind_addr = "[::]:3900"
