name: Backend CI

# Сборка бэкенда и все тесты (включая интеграционные на Testcontainers) на каждый push в main.
# Секреты не нужны: тесты сами поднимают PostgreSQL в Docker и создают себе временные ключи и сертификат.
on:
  push:
    branches: [main]
    # Пуши, которые не трогают бэкенд (например, только frontend/), тесты не запускают.
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"

permissions:
  contents: read

# Новый push отменяет ещё идущую проверку предыдущего.
concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest   # на нём уже есть Docker, он нужен Testcontainers
    timeout-minutes: 20

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Test
        run: dotnet test --configuration Release --no-build --logger "trx;LogFileName=test-results.trx" --results-directory ${{ github.workspace }}/test-results

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results/*.trx
          if-no-files-found: ignore
          retention-days: 7
